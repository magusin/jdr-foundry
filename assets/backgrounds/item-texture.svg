<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <!-- Toile tissée / sac de butin — treillis de losanges, mêmes coins
       partagés que armor-texture.svg pour un carrelage sans coutures. -->
  <g fill="none" stroke="#b8863a" stroke-width="1.8" opacity="0.16">
    <rect x="10" y="10" width="20" height="20" transform="rotate(45 20 20)"/>
    <rect x="40" y="10" width="20" height="20" transform="rotate(45 50 20)"/>
    <rect x="10" y="40" width="20" height="20" transform="rotate(45 20 50)"/>
    <rect x="40" y="40" width="20" height="20" transform="rotate(45 50 50)"/>
  </g>
</svg>
