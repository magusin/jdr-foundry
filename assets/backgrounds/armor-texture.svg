<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Cotte de mailles — anneaux répétés sur une grille 3x3, coins/bords
       partagés entre tuiles adjacentes pour un carrelage sans coutures. -->
  <g fill="none" stroke="#2f8ea0" stroke-width="2.4" opacity="0.16">
    <circle cx="0" cy="0" r="27"/>
    <circle cx="50" cy="0" r="27"/>
    <circle cx="100" cy="0" r="27"/>
    <circle cx="0" cy="50" r="27"/>
    <circle cx="50" cy="50" r="27"/>
    <circle cx="100" cy="50" r="27"/>
    <circle cx="0" cy="100" r="27"/>
    <circle cx="50" cy="100" r="27"/>
    <circle cx="100" cy="100" r="27"/>
  </g>
</svg>
